<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#F5F5F5" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#1C1C1C" media="(prefers-color-scheme: dark)" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Domo" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32-a8a02d7f8f.png" />
    <link rel="icon" type="image/svg+xml" sizes="any" href="/icons/favicon-a8a02d7f8f.svg" />
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon-a8a02d7f8f.png" />
    <title>Domo</title>
    <script>
      // Apply a light/dark choice before the first paint, so the page never flashes the other theme.
      try {
        const theme = localStorage.getItem("domo.theme")
        if (theme === "light" || theme === "dark") document.documentElement.dataset.theme = theme
      } catch {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
