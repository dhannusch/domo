  - generic [ref=e71]:
    - heading "What stays true in all four" [level=2] [ref=e72]
    - paragraph [ref=e73]: One chat, no sidebar, stable history, checkable sources, Literata and Instrument Sans, cool paper and night paper, graphite and sage, the same six components. Every mock is isolated from the app.
    - paragraph [ref=e74]: Compare the conversation first. Then switch to components, settings and the viewer. Interactive mode lets you try Choice, Reply, source View, checklist, sheets and settings. These are local demonstrations; no agent or account is connected.
    - paragraph [ref=e75]:
      - strong [ref=e76]: "Recommendation:"
      - text: A for the strongest reading experience; C for the most comfortable phone experience. B suits frequent decisions. D puts the most emphasis on finished documents. These are design judgments; your preference decides.