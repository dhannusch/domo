<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Domo — direction comparison</title><link rel="icon" href="data:,"><style>@font-face{font-family:Instrument;src:url('options/assets/instrument.woff2');font-weight:100 900}*{box-sizing:border-box}body{margin:0;padding:28px 32px;background:#e9ece5;color:#283029;font:15px/1.5 Instrument,sans-serif}.head{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:22px}.head h1{font-size:24px;font-weight:500;margin:0}.head p{font-size:13px;margin:0;color:#53614f}.grid{display:grid;grid-template-columns:repeat(4,375px);gap:24px}.direction h2{font-size:19px;font-weight:500;margin:0 0 12px}.direction img{display:block;width:375px;height:auto;border:1px solid #bdc8b5;border-radius:6px}.direction p{font-size:14px;margin:12px 0 0;max-width:360px}.direction small{display:block;color:#53614f;margin-top:5px;font-size:13px}.desktop .grid{grid-template-columns:repeat(2,720px);gap:28px}.desktop .direction img{width:720px}.desktop .direction p{max-width:720px}</style></head><body><div class="head"><h1>Domo · Four directions</h1><p id="context"></p></div><main class="grid" id="grid"></main><script>const p=new URLSearchParams(location.search),theme=p.get('theme')||'light',device=p.get('device')||'phone';document.body.className=device;document.getElementById('context').textContent=`${device==='phone'?'375px phone':'1440px desktop'} · ${theme} · Real HTML rendered in Chrome · App unchanged`;const options=[['a-correspondence','A · Correspondence','The most open, editorial reading experience.','More whitespace; longer scroll.'],['b-quiet-utility','B · Quiet Utility','Compact, precise controls for frequent decisions.','Efficient; more utilitarian.'],['c-soft-focus','C · Soft Focus','Rounded, tactile controls built around phone comfort.','Larger surfaces; source opens a sheet.'],['d-folio','D · Folio','Structured, document-like decisions and handoffs.','More formal; heavier decision framing.']];document.getElementById('grid').innerHTML=options.map(([dir,title,rationale,tradeoff])=>`<article class="direction"><h2>${title}</h2><img src="captures/${dir}-${device}-${theme}-chat.png" alt="${title}"><p>${rationale}<small>${tradeoff}</small></p></article>`).join('')</script></body></html>
