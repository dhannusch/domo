<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" href="data:,"><title>Soft Focus · Palette comparison</title><style>@font-face{font-family:Instrument;src:url('../options/assets/instrument.woff2');font-weight:100 900}*{box-sizing:border-box}body{margin:0;padding:26px 32px;background:#eeece8;color:#302f2b;font:14px/1.5 Instrument,sans-serif}.head{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:20px}.head h1{font-weight:500;font-size:24px;margin:0}.head p{margin:0;font-size:13px;color:#625f58}.grid{display:grid;grid-template-columns:repeat(3,375px);gap:24px}h2{font-weight:500;font-size:20px;margin:0 0 4px}.description{font-size:13px;color:#625f58;min-height:40px;margin:0 0 12px}img{display:block;width:375px;height:auto;border:1px solid #c3beb5;border-radius:10px}.tradeoff{font-size:13px;color:#625f58;margin:12px 0 0}</style></head><body><header class="head"><h1>Soft Focus · Neutral study</h1><p id="context"></p></header><main class="grid" id="grid"></main><script>const theme=new URLSearchParams(location.search).get('theme')||'light';document.getElementById('context').textContent=`${theme==='dark'?'Dark':'Light'} · 375px · Identical layout, type and content`;const palettes=[['chalk','Chalk','Clean white and gray · Charcoal controls','The clearest, most neutral option.'],['stone','Stone','Soft mineral gray · Slight warmth','Balanced and understated.'],['linen','Linen','Warm off-white · Taupe and brown charcoal','Warmer and more paper-like.']];document.getElementById('grid').innerHTML=palettes.map(([id,name,description,tradeoff])=>`<article><h2>${name}</h2><p class="description">${description}</p><img src="captures/${id}-phone-${theme}-chat.png" alt="Soft Focus ${name}, ${theme}"><p class="tradeoff">${tradeoff}</p></article>`).join('')</script></body></html>
